<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claude Code Web Chat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header / Config ── */
    header {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    header h1 { font-size: 16px; font-weight: 600; color: #58a6ff; white-space: nowrap; }

    .config-group { display: flex; align-items: center; gap: 6px; }
    .config-group label { font-size: 12px; color: #8b949e; }
    .config-group input, .config-group select {
      background: #0d1117; border: 1px solid #30363d; color: #c9d1d9;
      padding: 4px 8px; border-radius: 6px; font-size: 13px;
    }
    .config-group input { width: 300px; }

    .session-badge {
      margin-left: auto; font-size: 11px; color: #484f58;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }

    /* ── Chat area ── */
    #chat {
      flex: 1; overflow-y: auto; padding: 20px;
      display: flex; flex-direction: column; gap: 16px;
    }

    .message { max-width: 85%; line-height: 1.5; }

    .message.user {
      align-self: flex-end; background: #1f6feb; color: #fff;
      padding: 10px 16px; border-radius: 16px 16px 4px 16px;
      white-space: pre-wrap; word-break: break-word;
    }
    .message.user.replay { opacity: 0.5; }

    .message.assistant {
      align-self: flex-start; background: #161b22; border: 1px solid #30363d;
      padding: 14px 18px; border-radius: 4px 16px 16px 16px;
    }

    .message.assistant .text { white-space: pre-wrap; word-break: break-word; }
    .message.assistant .text code {
      background: #0d1117; padding: 2px 6px; border-radius: 4px;
      font-family: 'SF Mono', 'Fira Code', monospace; font-size: 0.9em;
    }
    .message.assistant .text pre {
      background: #0d1117; padding: 12px; border-radius: 6px; overflow-x: auto;
      margin: 8px 0; font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 0.85em; line-height: 1.4;
    }

    /* ── Tool blocks ── */
    .tool-block {
      margin: 8px 0; border: 1px solid #30363d; border-radius: 8px; overflow: hidden;
    }
    .tool-header {
      display: flex; align-items: center; gap: 8px; padding: 8px 12px;
      background: #1c2128; cursor: pointer; font-size: 13px; user-select: none;
    }
    .tool-header:hover { background: #22272e; }
    .tool-icon { font-size: 11px; color: #8b949e; transition: transform 0.2s; }
    .tool-block.expanded .tool-icon { transform: rotate(90deg); }
    .tool-name {
      font-weight: 600; color: #d2a8ff;
      font-family: 'SF Mono', 'Fira Code', monospace; font-size: 12px;
    }
    .tool-summary {
      color: #8b949e; font-size: 12px; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap; flex: 1;
    }
    .tool-status { font-size: 11px; margin-left: auto; }
    .tool-status.running { color: #d29922; }
    .tool-status.done { color: #3fb950; }
    .tool-status.error { color: #f85149; }

    .tool-body {
      display: none; padding: 10px 12px; background: #0d1117;
      font-family: 'SF Mono', 'Fira Code', monospace; font-size: 12px;
      white-space: pre-wrap; word-break: break-all; max-height: 300px; overflow-y: auto;
    }
    .tool-block.expanded .tool-body { display: block; }

    .tool-result {
      border-top: 1px solid #30363d; padding: 10px 12px; background: #0d1117;
      display: none; font-family: 'SF Mono', 'Fira Code', monospace; font-size: 12px;
      white-space: pre-wrap; word-break: break-all; max-height: 300px; overflow-y: auto;
    }
    .tool-block.expanded .tool-result.has-content { display: block; }

    /* ── Approval dialog ── */
    .approval-block {
      margin: 8px 0; border: 1px solid #d29922; border-radius: 8px;
      padding: 12px; background: #1c2128;
    }
    .approval-block .title {
      font-weight: 600; color: #d29922; margin-bottom: 8px; font-size: 13px;
    }
    .approval-block .tool-info {
      font-family: 'SF Mono', 'Fira Code', monospace; font-size: 12px;
      color: #8b949e; margin-bottom: 10px;
    }
    .approval-actions { display: flex; gap: 8px; }
    .approval-actions button {
      padding: 6px 16px; border: none; border-radius: 6px;
      font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .btn-approve { background: #238636; color: #fff; }
    .btn-approve:hover { background: #2ea043; }
    .btn-deny { background: #da3633; color: #fff; }
    .btn-deny:hover { background: #f85149; }
    .approval-block.resolved { opacity: 0.5; border-color: #30363d; }

    /* ── Rate limit ── */
    .rate-limit {
      padding: 8px 16px; font-size: 12px; color: #d29922; text-align: center;
      background: #1c1a00; border: 1px solid #3d3000; border-radius: 6px;
    }

    /* ── Status indicator ── */
    .status { padding: 8px 16px; font-size: 13px; color: #8b949e; text-align: center; }
    .status.thinking::after { content: ''; animation: dots 1.5s infinite; }
    @keyframes dots {
      0%, 20% { content: '.'; } 40% { content: '..'; } 60%, 100% { content: '...'; }
    }

    /* ── Input area ── */
    footer { background: #161b22; border-top: 1px solid #30363d; padding: 16px 20px; }
    .input-row { display: flex; gap: 10px; max-width: 900px; margin: 0 auto; }
    #prompt {
      flex: 1; background: #0d1117; border: 1px solid #30363d; color: #c9d1d9;
      padding: 10px 14px; border-radius: 10px; font-size: 14px; font-family: inherit;
      resize: none; min-height: 44px; max-height: 200px; line-height: 1.4;
    }
    #prompt:focus { outline: none; border-color: #58a6ff; }
    #send {
      background: #238636; color: #fff; border: none; padding: 10px 20px;
      border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer;
      white-space: nowrap; align-self: flex-end;
    }
    #send:hover { background: #2ea043; }
    #send:disabled { background: #21262d; color: #484f58; cursor: not-allowed; }
    #stop {
      background: #da3633; color: #fff; border: none; padding: 10px 20px;
      border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer;
      white-space: nowrap; align-self: flex-end; display: none;
    }
    #stop:hover { background: #f85149; }
    .hint { text-align: center; font-size: 11px; color: #484f58; margin-top: 6px; }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #484f58; }
  </style>
</head>
<body>
  <header>
    <h1>Claude Code Web</h1>
    <div class="config-group">
      <label for="cwd">Working Dir:</label>
      <input type="text" id="cwd" placeholder="/path/to/your/project" />
    </div>
    <div class="config-group">
      <label for="model">Model:</label>
      <select id="model">
        <option value="">Default</option>
        <option value="claude-opus-4-6">Opus 4.6</option>
        <option value="claude-sonnet-4-6">Sonnet 4.6</option>
        <option value="claude-haiku-4-5-20251001">Haiku 4.5</option>
      </select>
    </div>
    <div class="config-group">
      <label for="mode">Mode:</label>
      <select id="mode">
        <option value="auto">Auto (bypass permissions)</option>
        <option value="supervised">Supervised (approve tools)</option>
        <option value="plan">Plan (approve plan only)</option>
      </select>
    </div>
    <span class="session-badge" id="session-badge"></span>
  </header>

  <div id="chat"></div>

  <footer>
    <div class="input-row">
      <textarea id="prompt" rows="1" placeholder="Send a message to Claude Code..." autofocus></textarea>
      <button id="send">Send</button>
      <button id="stop">Stop</button>
    </div>
    <div class="hint">Enter to send, Shift+Enter for newline</div>
  </footer>

  <script>
    // ── DOM refs ──
    const chatEl = document.getElementById('chat');
    const promptEl = document.getElementById('prompt');
    const sendBtn = document.getElementById('send');
    const stopBtn = document.getElementById('stop');
    const cwdEl = document.getElementById('cwd');
    const modelEl = document.getElementById('model');
    const modeEl = document.getElementById('mode');
    const sessionBadge = document.getElementById('session-badge');

    // ── State ──
    let sessionId = null;
    let messageIds = [];
    let internalId = null;
    let isStreaming = false;
    const toolBlocks = new Map();

    // ── Input ──
    promptEl.addEventListener('input', () => {
      promptEl.style.height = 'auto';
      promptEl.style.height = Math.min(promptEl.scrollHeight, 200) + 'px';
    });

    promptEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    sendBtn.addEventListener('click', sendMessage);
    stopBtn.addEventListener('click', interruptSession);

    // ── Helpers ──
    function scrollToBottom() { chatEl.scrollTop = chatEl.scrollHeight; }
    function escapeHtml(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function escapeAndFormat(text) {
      let s = escapeHtml(text);
      s = s.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => `<pre><code>${code}</code></pre>`);
      s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
      s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      return s;
    }

    function addUserMessage(text, isReplay) {
      const div = document.createElement('div');
      div.className = 'message user' + (isReplay ? ' replay' : '');
      div.textContent = text;
      chatEl.appendChild(div);
      scrollToBottom();
    }

    function createAssistantMessage() {
      const div = document.createElement('div');
      div.className = 'message assistant';
      chatEl.appendChild(div);
      scrollToBottom();
      return div;
    }

    function addStatusMessage(text, className) {
      const div = document.createElement('div');
      div.className = 'status ' + (className || '');
      div.textContent = text;
      chatEl.appendChild(div);
      scrollToBottom();
      return div;
    }

    function removeEl(el) { if (el?.parentNode) el.parentNode.removeChild(el); }

    // ── Render assistant content (handles partial messages) ──
    function renderAssistantContent(container, contentBlocks) {
      let html = '';
      for (const block of contentBlocks) {
        if (block.type === 'text') {
          html += `<div class="text">${escapeAndFormat(block.text || '')}</div>`;
        } else if (block.type === 'thinking') {
          html += `<div class="text" style="color:#8b949e;font-style:italic">${escapeHtml(block.thinking || '')}</div>`;
        }
      }
      // Preserve existing tool blocks appended to this container
      const toolEls = container.querySelectorAll('.tool-block, .approval-block');
      container.innerHTML = html;
      toolEls.forEach(el => container.appendChild(el));
      scrollToBottom();
    }

    // ── Tool blocks ──
    function getToolSummary(name, input) {
      if (!input) return '';
      if ((name === 'Read' || name === 'Write' || name === 'Edit') && input.file_path) return input.file_path;
      if (name === 'Bash' && input.command) return input.command.substring(0, 80);
      if ((name === 'Glob' || name === 'Grep') && input.pattern) return input.pattern;
      if (name === 'Agent' && input.description) return input.description;
      if (name === 'WebFetch' && input.url) return input.url;
      return '';
    }

    function getOrCreateToolBlock(container, toolId, toolName, input) {
      if (toolBlocks.has(toolId)) return toolBlocks.get(toolId);

      const block = document.createElement('div');
      block.className = 'tool-block';
      const summary = getToolSummary(toolName, input);

      block.innerHTML = `
        <div class="tool-header">
          <span class="tool-icon">&#9654;</span>
          <span class="tool-name">${escapeHtml(toolName)}</span>
          <span class="tool-summary">${escapeHtml(summary)}</span>
          <span class="tool-status running">running</span>
        </div>
        <div class="tool-body">${escapeHtml(JSON.stringify(input, null, 2))}</div>
        <div class="tool-result"></div>
      `;

      block.querySelector('.tool-header').addEventListener('click', () => {
        block.classList.toggle('expanded');
      });

      container.appendChild(block);
      toolBlocks.set(toolId, block);
      scrollToBottom();
      return block;
    }

    function setToolResult(toolId, result, isError) {
      const block = toolBlocks.get(toolId);
      if (!block) return;

      const statusEl = block.querySelector('.tool-status');
      statusEl.textContent = isError ? 'error' : 'done';
      statusEl.className = 'tool-status ' + (isError ? 'error' : 'done');

      const resultEl = block.querySelector('.tool-result');
      let text = typeof result === 'string' ? result : JSON.stringify(result, null, 2);
      if (text && text.length > 3000) text = text.substring(0, 3000) + '\n... (truncated)';
      resultEl.textContent = text || '(empty)';
      resultEl.classList.add('has-content');
      if (isError) resultEl.style.color = '#f85149';
    }

    // ── Approval UI ──
    function showApprovalRequest(container, data) {
      const block = document.createElement('div');
      block.className = 'approval-block';
      block.innerHTML = `
        <div class="title">Approval needed: ${escapeHtml(data.tool_name)}</div>
        <div class="tool-info">${escapeHtml(JSON.stringify(data.input, null, 2))}</div>
        <div class="approval-actions">
          <button class="btn-approve">Approve</button>
          <button class="btn-deny">Deny</button>
        </div>
      `;

      block.querySelector('.btn-approve').addEventListener('click', async () => {
        block.classList.add('resolved');
        block.querySelector('.title').textContent += ' — Approved';
        block.querySelector('.approval-actions').style.display = 'none';
        await respondToApproval(data.request_id, true);
      });

      block.querySelector('.btn-deny').addEventListener('click', async () => {
        const reason = window.prompt('Reason for denial (optional):') || '';
        block.classList.add('resolved');
        block.querySelector('.title').textContent += ' — Denied';
        block.querySelector('.approval-actions').style.display = 'none';
        await respondToApproval(data.request_id, false, reason);
      });

      container.appendChild(block);
      scrollToBottom();
    }

    async function respondToApproval(requestId, approved, reason) {
      try {
        await fetch('/api/respond', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ internalId, requestId, approved, reason }),
        });
      } catch (err) {
        console.error('Failed to send approval response:', err);
      }
    }

    // ── Interrupt ──
    async function interruptSession() {
      if (!internalId) return;
      try {
        await fetch('/api/interrupt', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ internalId }),
        });
      } catch (err) {
        console.error('Failed to interrupt:', err);
      }
    }

    // ── Send message ──
    async function sendMessage() {
      const prompt = promptEl.value.trim();
      if (!prompt || isStreaming) return;

      isStreaming = true;
      sendBtn.disabled = true;
      sendBtn.style.display = 'none';
      stopBtn.style.display = 'block';
      promptEl.value = '';
      promptEl.style.height = 'auto';
      toolBlocks.clear();

      addUserMessage(prompt);
      const statusEl = addStatusMessage('Claude is thinking', 'thinking');
      const assistantEl = createAssistantMessage();
      let lastToolUseId = null;

      try {
        const body = { prompt, mode: modeEl.value };
        if (sessionId) body.sessionId = sessionId;
        if (cwdEl.value.trim()) body.cwd = cwdEl.value.trim();
        if (modelEl.value) body.model = modelEl.value;

        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let sseBuffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          sseBuffer += decoder.decode(value, { stream: true });
          const lines = sseBuffer.split('\n');
          sseBuffer = lines.pop();

          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            let data;
            try { data = JSON.parse(line.slice(6)); } catch { continue; }
            handleEvent(data, assistantEl, statusEl);
          }
        }
      } catch (err) {
        removeEl(statusEl);
        addStatusMessage('Error: ' + err.message);
      } finally {
        isStreaming = false;
        sendBtn.disabled = false;
        sendBtn.style.display = 'block';
        stopBtn.style.display = 'none';
        promptEl.focus();
      }
    }

    // ── Event handler (mirrors ClaudeJson enum) ──
    function handleEvent(data, assistantEl, statusEl) {
      switch (data.type) {
        // ── Internal tracking ──
        case '_internal':
          internalId = data.internalId;
          break;

        // ── System init ──
        case 'system':
          if (data.session_id) sessionId = data.session_id;
          if (data.model) sessionBadge.textContent = data.model;
          break;

        // ── Assistant message (partial updates via --include-partial-messages) ──
        case 'assistant': {
          removeEl(statusEl);
          const content = data.message?.content;
          if (Array.isArray(content)) {
            renderAssistantContent(assistantEl, content);
          } else if (typeof content === 'string') {
            assistantEl.innerHTML = `<div class="text">${escapeAndFormat(content)}</div>`;
          }
          if (data.session_id) sessionId = data.session_id;
          break;
        }

        // ── Replayed user messages (from --replay-user-messages on --resume) ──
        case 'user': {
          if (data.isReplay || data.isSynthetic) {
            // Show replayed history lightly
            const text = data.message?.content;
            if (typeof text === 'string') {
              addUserMessage(text, true);
            } else if (Array.isArray(text)) {
              const textContent = text.filter(b => b.type === 'text').map(b => b.text).join('\n');
              if (textContent) addUserMessage(textContent, true);
            }
          }
          break;
        }

        // ── Tool invocation ──
        case 'tool_use': {
          removeEl(statusEl);
          const input = data.tool_data?.input || data.input || {};
          getOrCreateToolBlock(assistantEl, data.id, data.tool_name, input);
          break;
        }

        // ── Tool result ──
        case 'tool_result': {
          const lastId = [...toolBlocks.keys()].pop();
          if (lastId) setToolResult(lastId, data.result, data.is_error);
          break;
        }

        // ── Stream events (content_block_delta, etc.) ──
        case 'stream_event':
          // Handled via assistant partial messages; no extra action needed
          break;

        // ── Rate limit ──
        case 'rate_limit_event': {
          const info = data.rate_limit_info;
          const msg = info ? `Rate limited — retry in ${info.retry_after || '?'}s` : 'Rate limited';
          const div = document.createElement('div');
          div.className = 'rate_limit';
          div.textContent = msg;
          chatEl.appendChild(div);
          scrollToBottom();
          break;
        }

        // ── Approval request (supervised/plan mode) ──
        case 'approval_request':
          showApprovalRequest(assistantEl, data);
          break;

        // ── Turn complete ──
        case 'result':
          removeEl(statusEl);
          if (data.session_id) sessionId = data.session_id;
          if (data.is_error && data.error) addStatusMessage('Error: ' + data.error);
          if (sessionId) sessionBadge.textContent = `session: ${sessionId.slice(0, 8)}...`;
          break;

        // ── Process finished ──
        case 'done':
          removeEl(statusEl);
          if (data.session_id) sessionId = data.session_id;
          if (data.message_ids) messageIds = data.message_ids;
          if (data.exit_code !== 0 && data.exit_code != null) {
            addStatusMessage('Process exited with code ' + data.exit_code);
          }
          break;

        // ── Error ──
        case 'error':
          removeEl(statusEl);
          addStatusMessage('Error: ' + data.content);
          break;

        // ── Stderr (usually noise) ──
        case 'stderr':
          break;
      }
    }
  </script>
</body>
</html>
